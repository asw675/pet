name: Windows x64 package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-package.yml'
      - '.gitattributes'
      - '.node-version'
      - 'apps/desktop/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install locked dependencies
        run: |
          npm install --global pnpm@10.30.3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test on Windows
        env:
          NO_COLOR: '1'
        run: |
          $testLog = Join-Path $env:RUNNER_TEMP 'pet-test-output.txt'
          pnpm test 2>&1 | Tee-Object -FilePath $testLog
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            $failures = Select-String -LiteralPath $testLog -SimpleMatch ' FAIL ' -Context 0,8 | Select-Object -First 12
            foreach ($failure in $failures) {
              $details = (@($failure.Line) + @($failure.Context.PostContext)) -join "`n"
              $message = $details.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
              Write-Output "::error title=Windows verification log::$message"
            }
            if (-not $failures) { Get-Content -LiteralPath $testLog -Tail 30 | Write-Output }
          }
          exit $testExit
      - name: Build Windows native helpers
        run: |
          $buildLog = Join-Path $env:RUNNER_TEMP 'pet-native-build.txt'
          try {
            & ./apps/desktop/scripts/stage-win-native.ps1 2>&1 | Tee-Object -FilePath $buildLog
          } catch {
            $details = (@(Get-Content -LiteralPath $buildLog -Tail 25 -ErrorAction SilentlyContinue) + @($_.Exception.Message)) -join "`n"
            $message = $details.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Windows native build log::$message"
            throw
          }
      - name: Build and verify NSIS installer
        run: |
          $buildLog = Join-Path $env:RUNNER_TEMP 'pet-installer-build.txt'
          pnpm --filter @pet-desktop/desktop package:win 2>&1 | Tee-Object -FilePath $buildLog
          $buildExit = $LASTEXITCODE
          if ($buildExit -ne 0) {
            $details = (Get-Content -LiteralPath $buildLog -Tail 25) -join "`n"
            $message = $details.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Windows installer build log::$message"
          }
          exit $buildExit
      - uses: actions/upload-artifact@v4
        with:
          name: Pet-Desktop-Windows-x64
          path: apps/desktop/release/Pet-Desktop-*-win-x64.exe
          if-no-files-found: error
