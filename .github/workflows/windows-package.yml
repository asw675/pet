name: Windows x64 package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-package.yml'
      - '.node-version'
      - 'apps/desktop/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install locked dependencies
        run: |
          npm install --global pnpm@10.30.3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm install --frozen-lockfile
      - name: Check and test
        run: |
          pnpm typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test
      - name: Build Windows native helpers
        run: ./apps/desktop/scripts/stage-win-native.ps1
      - name: Build and verify NSIS installer
        run: pnpm --filter @pet-desktop/desktop package:win
      - uses: actions/upload-artifact@v4
        with:
          name: Pet-Desktop-Windows-x64
          path: apps/desktop/release/Pet-Desktop-*-win-x64.exe
          if-no-files-found: error
