appId: com.petdesktop.app
productName: Pet Desktop
directories:
  output: release
files:
  - out/**/*
  - package.json
extraResources:
  - from: native/publish/win-x64
    to: native
    filter:
      - voice/whisper-cli.exe
      - voice/pet-desktop-sapi.exe
      - launch-inspect/launch-inspect.exe
asarUnpack:
  - '**/*.node'
  - '**/better-sqlite3/**'
npmRebuild: true
win:
  target:
    - target: nsis
      arch: x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
