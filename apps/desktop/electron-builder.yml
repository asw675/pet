appId: com.petdesktop.app
productName: Pet Desktop
directories:
  output: release
files:
  - out/**/*
  - package.json
extraResources:
  - from: native/publish/win-x64/voice
    to: native/voice/win-x64
    filter:
      - whisper-cli.exe
      - pet-desktop-sapi.exe
      - whisper-LICENSE.txt
  - from: native/publish/win-x64/launch-inspect
    to: native/launch-inspect
    filter:
      - launch-inspect.exe
asarUnpack:
  - '**/*.node'
  - '**/better-sqlite3/**'
npmRebuild: true
win:
  artifactName: Pet-Desktop-${version}-win-${arch}.${ext}
  target:
    - target: nsis
      arch: x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
